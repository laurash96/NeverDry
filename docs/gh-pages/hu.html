    <!-- This page moved to https://never-dry.github.io/NeverDry/hu/, one prefix per language on a tree that
         mirrors the English one. The old address stays alive because it has been
         published in posts, forum replies and other people's bookmarks, and a
         link that dies takes the reader nowhere at all.

         It is a redirect and not a copy: noindex keeps it out of the index,
         canonical hands any accumulated ranking to the real page, and there is
         no language switch here - the redirect happens before anyone could use
         one. It is deliberately absent from sitemap.xml, which carries only
         addresses that answer 200 with their own content. -->
    <meta http-equiv="refresh" content="0; url=https://never-dry.github.io/NeverDry/hu/">
